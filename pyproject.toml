[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "butler-core-midgard-plugin"
version = "0.0.1.dev0"
description = "Cross-Butler communication channel for the Butler ecosystem"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "butler-core @ https://github.com/keriol/butler-core/archive/e0e41b26f8f421c8a2043e6061121b520958d90c.tar.gz",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=7,<8",
    "wheel>=0.45",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
