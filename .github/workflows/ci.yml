name: Midgard CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q src tests

      - name: Test with coverage
        run: >-
          python -m pytest -q
          --cov=butler_midgard
          --cov-report=term-missing
          --cov-report=xml:coverage.xml

      - name: Build distributions
        run: python -m build

      - name: Clean-room wheel check
        shell: bash
        run: |
          set -Eeuo pipefail
          CLEAN="$(mktemp -d)"
          python -m venv "$CLEAN/venv"
          "$CLEAN/venv/bin/python" -m pip install --quiet --no-deps dist/*.whl
          cd "$CLEAN"
          "$CLEAN/venv/bin/python" - <<'PY'
          from butler_midgard import MidgardRequest
          req = MidgardRequest(request_id="smoke", message="hello")
          assert req.request_id == "smoke"
          print("Clean-room Midgard contract: OK")
          PY
